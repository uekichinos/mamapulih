; Local dev only: Sail's bind-mounted project directory on Windows makes
; every filesystem stat slow. Opcache's default revalidate_freq=2 means it
; re-stats every included file on practically every request once you've
; spent more than 2s reading a page, which is where the "slow between
; pages" feel comes from. Widening the window to 60s keeps edits showing
; up within a reasonable time while avoiding that stat storm on every nav.
opcache.revalidate_freq=60
